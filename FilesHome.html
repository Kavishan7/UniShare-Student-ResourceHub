<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniShare | Centralized ICT Resource Platform</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
        :root {
    --primary: #006c46;
    --primary-container: #00b074;
    --on-primary-container: #003a23;
    --surface-container-lowest: #ffffff;
    --on-surface-variant: #3d4a41;
    --outline-variant: #bccabf;
    --border-radius-xl: 0.75rem;
}

.text-primary-theme { 
    color: var(--primary) !important; 
}

.bg-surface-container-lowest { 
    background-color: var(--surface-container-lowest) !important; 
}

.navbar {
    height: 80px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--outline-variant);
}

.nav-link {
    color: var(--on-surface-variant);
    font-weight: 500;
    padding: 0.5rem 1rem !important;
}

.nav-link.active {
    color: var(--primary) !important;
    border-bottom: 2px solid var(--primary);
}

.btn-primary-custom {
    background-color: var(--primary-container);
    color: var(--on-primary-container);
    border: none;
    padding: 0.75rem 1.5rem;
    font-weight: 700;
    border-radius: var(--border-radius-xl);
    transition: all 0.3s ease;
}

.btn-primary-custom:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0, 176, 116, 0.2);
        }

        .card-custom {
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--border-radius-xl);
            transition: transform 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        .card-custom:hover {
            transform: translateY(-4px);
            color: inherit;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .resource-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--outline-variant);
            transition: background-color 0.2s ease;
        }
        .resource-item:last-child { border-bottom: none; }
        .resource-item:hover { background-color: var(--surface-container-low); }

        .file-icon {
            width: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .badge-custom {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
        }

        footer {
            background-color: var(--surface-container-low);
            border-top: 1px solid var(--outline-variant);
        }
    </style>
</head>
<body>
    <!-- Recently Added Resources -->
<section class="container mb-5 pb-5">
<p class="small fw-bold text-on-surface-variant text-uppercase mb-4">Recently Added Resources</p>
<div class="card-custom overflow-hidden shadow-sm">
<!-- Resource Item 1 -->
<div class="resource-item d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
<div class="d-flex align-items-center gap-4">
<div class="file-icon bg-danger bg-opacity-10 border-danger border-opacity-10">
<span class="material-symbols-outlined text-danger">picture_as_pdf</span>
</div>
<div>
<h6 class="fw-bold mb-1">Data Structures and Algorithms.pdf</h6>
<div class="d-flex align-items-center gap-2 small text-muted">
<span class="badge-custom bg-surface-container text-dark">Programming</span>
<span>•</span>
<span>21 May 2024</span>
</div>
</div>
</div>
<button class="btn btn-link text-primary-theme p-2 rounded-circle hover-effect">
<span class="material-symbols-outlined">download</span>
</button>
</div>
<!-- Resource Item 2 -->
<div class="resource-item d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
<div class="d-flex align-items-center gap-4">
<div class="file-icon bg-info bg-opacity-10 border-info border-opacity-10">
<span class="material-symbols-outlined text-info">description</span>
</div>
<div>
<h6 class="fw-bold mb-1">Calculus Notes.docx</h6>
<div class="d-flex align-items-center gap-2 small text-muted">
<span class="badge-custom bg-info bg-opacity-10 text-primary">Maths</span>
<span>•</span>
<span>19 May 2024</span>
</div>
</div>
</div>
<button class="btn btn-link text-primary-theme p-2 rounded-circle hover-effect">
<span class="material-symbols-outlined">download</span>
</button>
</div>
<!-- Resource Item 3 -->
<div class="resource-item d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
<div class="d-flex align-items-center gap-4">
<div class="file-icon bg-warning bg-opacity-10 border-warning border-opacity-10">
<span class="material-symbols-outlined text-warning">slideshow</span>
</div>
<div>
<h6 class="fw-bold mb-1">Web Development Basics.pptx</h6>
<div class="d-flex align-items-center gap-2 small text-muted">
<span class="badge-custom bg-secondary bg-opacity-10 text-secondary">Web Tech</span>
<span>•</span>
<span>17 May 2024</span>
</div>
</div>
</div>
<button class="btn btn-link text-primary-theme p-2 rounded-circle hover-effect">
<span class="material-symbols-outlined">download</span>
</button>
</div>
</div>
</section>
</main>
</body>
</html>
