<style>
        :root {
    --primary: #006c46;
    --primary-container: #00b074;
    --on-primary-container: #003a23;
    --surface-container-lowest: #ffffff;
    --on-surface-variant: #3d4a41;
    --outline-variant: #bccabf;
    --border-radius-xl: 0.75rem;
}

.text-primary-theme { 
    color: var(--primary) !important; 
}

.bg-surface-container-lowest { 
    background-color: var(--surface-container-lowest) !important; 
}

.navbar {
    height: 80px;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--outline-variant);
}

.nav-link {
    color: var(--on-surface-variant);
    font-weight: 500;
    padding: 0.5rem 1rem !important;
}

.nav-link.active {
    color: var(--primary) !important;
    border-bottom: 2px solid var(--primary);
}

.btn-primary-custom {
    background-color: var(--primary-container);
    color: var(--on-primary-container);
    border: none;
    padding: 0.75rem 1.5rem;
    font-weight: 700;
    border-radius: var(--border-radius-xl);
    transition: all 0.3s ease;
}

.btn-primary-custom:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(0, 176, 116, 0.2);
        }

        .card-custom {
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--border-radius-xl);
            transition: transform 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        .card-custom:hover {
            transform: translateY(-4px);
            color: inherit;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .resource-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--outline-variant);
            transition: background-color 0.2s ease;
        }
        .resource-item:last-child { border-bottom: none; }
        .resource-item:hover { background-color: var(--surface-container-low); }

        .file-icon {
            width: 40px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .badge-custom {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 4px;
        }

        footer {
            background-color: var(--surface-container-low);
            border-top: 1px solid var(--outline-variant);
        }
    </style>
</head>
