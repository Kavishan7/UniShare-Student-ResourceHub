<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>UniShare Catalog - Academic Resources</title>
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --primary: #006c46;
            --primary-container: #00b074;
            --on-primary-container: #003a23;
            --bs-primary: #006c46;
            --bs-primary-rgb: 0, 108, 70;
            --academic-emerald: #00b074;
            --surface: #f8f9ff;
            --surface-container-lowest: #ffffff;
            --on-surface: #0b1c30;
            --on-surface-variant: #3d4a41;
            --secondary: #565e74;
            --outline-variant: #bccabf;
            --border-radius-xl: 0.75rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--surface);
            color: var(--on-surface);
            padding-top: 80px;
        }

        /* Navbar Styles from Home Page */
        .text-primary-theme { 
            color: var(--primary) !important; 
        }

        .bg-surface-container-lowest { 
            background-color: var(--surface-container-lowest) !important; 
        }

        .navbar {
            height: 80px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--outline-variant);
        }

        .nav-link {
            color: var(--on-surface-variant);
            font-weight: 500;
            padding: 0.5rem 1rem !important;
        }

        .nav-link.active {
            color: var(--primary) !important;
            border-bottom: 2px solid var(--primary);
        }

        .btn-primary-custom {
            background-color: var(--primary-container);
            color: var(--on-primary-container);
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            border-radius: var(--border-radius-xl);
            transition: all 0.3s ease;
        }

        .btn-primary-custom:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 176, 116, 0.2);
        }

        /* Page Content Styles */
        .btn-emerald {
            background-color: var(--academic-emerald);
            color: white;
            border: none;
        }

        .btn-emerald:hover {
            background-color: #009663;
            color: white;
        }

        .btn-primary-emerald {
            background-color: var(--bs-primary);
            color: white;
            border: none;
        }

        .btn-primary-emerald:hover {
            background-color: #005436;
            color: white;
        }

        .resource-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--outline-variant);
            border-radius: 0.75rem;
        }

        .resource-card:hover {
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.06);
            border-color: var(--academic-emerald);
            transform: translateY(-2px);
        }

        .list-group-item {
            border: none;
            padding: 1rem;
            color: var(--secondary);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-group-item.active {
            background-color: var(--academic-emerald);
            border-color: var(--academic-emerald);
            color: white;
        }

        .list-group-item:not(.active):hover {
            background-color: #eff4ff;
            color: var(--bs-primary);
        }

        .search-bar-container {
            background-color: #ffffff;
            border: 1px solid var(--outline-variant);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }

        .material-symbols-outlined {
            vertical-align: middle;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        footer {
            border-top: 1px solid var(--outline-variant);
            padding: 3rem 0;
            background-color: var(--surface-container-low);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Pagination -->
<nav>
<ul class="pagination justify-content-center gap-2 border-0">
<li class="page-item">
<a aria-label="Previous" class="page-link rounded text-secondary border-light-subtle" href="#">
<span class="material-symbols-outlined fs-5">chevron_left</span>
</a>
</li>
<li class="page-item"><a class="page-link rounded btn-primary-emerald active border-0" href="#">1</a></li>
<li class="page-item"><a class="page-link rounded text-secondary border-light-subtle" href="#">2</a></li>
<li class="page-item"><a class="page-link rounded text-secondary border-light-subtle" href="#">3</a></li>
<li class="page-item disabled px-2 pt-1 text-muted">...</li>
<li class="page-item">
<a aria-label="Next" class="page-link rounded text-secondary border-light-subtle" href="#">
<span class="material-symbols-outlined fs-5">chevron_right</span>
</a>
</li>
</ul>
</nav>
</div>
</div>
</main>
</body>
</html>
