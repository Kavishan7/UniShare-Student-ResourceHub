<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | UniShare Academic Resource Platform</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<style>
        :root {
            --primary: #006c46;
            --primary-emerald: #00b074;
            --on-primary: #ffffff;
            --secondary: #565e74;
            --surface: #f8f9ff;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #eff4ff;
            --on-surface: #0b1c30;
            --on-surface-variant: #3d4a41;
            --outline-variant: #bccabf;
            --border-radius-lg: 0.5rem;
            --border-radius-xl: 0.75rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--surface);
            color: var(--on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Brand Colors & Utilities */
        .text-primary-theme { color: var(--primary) !important; }
        .bg-primary-emerald { background-color: var(--primary-emerald) !important; color: white !important; }
        
        /* Navbar Style (matching SCREEN_19/SCREEN_5) */
        .navbar {
            height: 80px;
            background: var(--surface-container-lowest);
            border-bottom: 1px solid var(--outline-variant);
        }
        .nav-link {
            color: var(--secondary);
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: var(--primary-emerald);
        }

        /* Card Styles */
        .registration-card {
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--border-radius-xl);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            max-width: 520px;
            width: 100%;
        }

        /* Form Controls */
        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--on-surface-variant);
            margin-bottom: 8px;
        }
        .input-group-text {
            background-color: var(--surface-container-low);
            border-color: var(--outline-variant);
            color: var(--secondary);
        }
        .form-control {
            border-color: var(--outline-variant);
            padding: 0.75rem 1rem;
            background-color: var(--surface-container-low);
        }
        .form-control:focus {
            border-color: var(--primary-emerald);
            box-shadow: 0 0 0 0.25rem rgba(0, 176, 116, 0.1);
            background-color: var(--surface-container-lowest);
        }

        .btn-emerald {
            background-color: var(--primary-emerald);
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            font-weight: 700;
            border-radius: var(--border-radius-lg);
            transition: all 0.2s ease;
        }
        .btn-emerald:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 176, 116, 0.2);
            color: white;
        }
        .btn-emerald:active {
            transform: scale(0.98);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--outline-variant);
            font-style: italic;
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--outline-variant);
        }
        .divider:not(:empty)::before { margin-right: 1.5em; }
        .divider:not(:empty)::after { margin-left: 1.5em; }

        footer {
            background-color: var(--surface-container-lowest);
            border-top: 1px solid var(--outline-variant);
        }
        .hover-primary:hover { color: var(--primary-emerald) !important; }

        /* Animation for icons */
        .input-group:focus-within .input-group-text .material-symbols-outlined {
            color: var(--primary-emerald);
        }
    </style>
</head>
<body>
    <!-- Main Registration Section -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5 mt-5">
<div class="container d-flex flex-column align-items-center pt-5">
<!-- Page Header -->
<div class="text-center mb-4">
<h1 class="display-6 fw-bold text-on-surface mb-2">Create your UniShare account</h1>
<p class="text-secondary fs-5">Register with your university student email to access resources</p>
</div>
<!-- Registration Form Card -->
<div class="registration-card p-4 p-md-5">
<form action="#" id="registrationForm" method="POST">
<!-- Full Name Field -->
<div class="mb-4">
<label class="form-label" for="full-name">Full name</label>
<div class="input-group">
<span class="input-group-text border-end-0">
<span class="material-symbols-outlined">person</span>
</span>
<input class="form-control border-start-0" id="full-name" name="full-name" placeholder="Your full name" required="" type="text"/>
</div>
</div>
<!-- Student Email Field -->
<div class="mb-4">
<label class="form-label" for="email">Student email</label>
<div class="input-group">
<span class="input-group-text border-end-0">
<span class="material-symbols-outlined">mail</span>
</span>
<input class="form-control border-start-0" id="email" name="email" placeholder="name@rjt.ac.lk" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="mb-4">
<label class="form-label" for="password">Password</label>
<div class="input-group">
<span class="input-group-text border-end-0">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Confirm Password Field -->
<div class="mb-4">
<label class="form-label" for="confirm-password">Confirm password</label>
<div class="input-group">
<span class="input-group-text border-end-0">
<span class="material-symbols-outlined">lock_reset</span>
</span>
<input class="form-control border-start-0" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms & Conditions -->
<div class="form-check mb-4">
<input class="form-check-input" id="terms" name="terms" required="" type="checkbox"/>
<label class="form-check-label small text-on-surface-variant" for="terms">
                        I agree to the <a class="text-primary-theme fw-bold text-decoration-none" href="#">terms &amp; conditions</a>
</label>
</div>
<!-- Register Button -->
<button class="btn btn-emerald w-100 d-flex align-items-center justify-content-center gap-2 mb-4" id="submitBtn" type="submit">
<span class="material-symbols-outlined">how_to_reg</span>
                    Register
                </button>
<!-- OR Divider -->
<div class="divider mb-4">OR</div>
<!-- Login Redirect -->
<div class="text-center">
<p class="mb-0 text-on-surface-variant small">
                        Already have an account? 
                        <a class="text-primary-theme fw-bold text-decoration-none ms-1 d-inline-flex align-items-center gap-1" href="Login.html">
                            Login here
                            <span class="material-symbols-outlined fs-6">arrow_forward</span>
</a>
</p>
</div>
</form>
</div>
</div>
</main>
</body>
</html>
